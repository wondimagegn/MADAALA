[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethiocontexteval"
version = "0.1.1"
description = "Human-grounded evaluation of multilingual generative AI for Ethiopian contexts (pilot)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Wondimagegn Desta" },
  { name = "Endalkachew H. Chala" },
]
keywords = [
  "evaluation",
  "multilingual",
  "amharic",
  "afaan-oromo",
  "ethiopia",
  "generative-ai",
  "bedrock",
  "responsible-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "statsmodels>=0.14.0",
  "python-dotenv>=1.0.0",
  "matplotlib>=3.7.0",
  "boto3>=1.41.0",
  "botocore[crt]>=1.41.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "ruff>=0.4.0",
]
aws = [
  "boto3>=1.41.0",
]

[project.urls]
Repository = "https://github.com/wondimagegn/ethiocontexteval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "integration: tests that need external services (Ollama/AWS); skipped in default CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

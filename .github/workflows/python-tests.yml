name: python-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies (no AWS required)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (mock provider only; no Ollama/AWS)
        run: pytest -m "not integration"
        env:
          ETHIOEVAL_PROVIDER: mock
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""

      - name: Validate dataset
        run: python -m ethiocontexteval.dataset validate data/scenarios.jsonl

      - name: Dry-run with MockProvider
        run: >
          python -m ethiocontexteval.runner
          --provider mock
          --config config/models.mock.json
          --dry-run
        env:
          ETHIOEVAL_PROVIDER: mock
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
